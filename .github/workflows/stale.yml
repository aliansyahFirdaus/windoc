name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in the last 60 days. It will be closed in 7 days if no
            further activity occurs.
          close-issue-message: >
            This issue was closed automatically after 67 days of inactivity.
            Feel free to reopen if this is still relevant.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity in the last 30 days. It will be closed in 7 days
            if no further activity occurs.
          close-pr-message: >
            This PR was closed automatically after 37 days of inactivity.
            Feel free to reopen if you'd like to continue working on it.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'bug,pinned,security,good first issue'
          exempt-pr-labels: 'pinned,security'
          operations-per-run: 100
