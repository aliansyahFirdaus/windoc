name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build @windoc/core
        run: yarn workspace @windoc/core build

      - name: Build @windoc/react
        run: yarn workspace @windoc/react build

      - name: Publish @windoc/core
        run: npm publish --access public --provenance
        working-directory: core

      - name: Publish @windoc/react
        run: npm publish --access public --provenance
        working-directory: react

      - name: Generate release notes
        run: npx git-cliff@latest --config cliff.toml --latest --strip header > RELEASE_NOTES.md

      - name: Update CHANGELOG.md
        run: npx git-cliff@latest --config cliff.toml --output CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): update CHANGELOG.md for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
