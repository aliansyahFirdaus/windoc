name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build @windoc/core
        run: yarn workspace @windoc/core build

      - name: Build @windoc/react
        run: yarn workspace @windoc/react build

      - name: Get npm OIDC token
        id: npm-oidc
        run: |
          TOKEN=$(curl --silent \
            -H "Accept: application/json; api-version=2.0" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://registry.npmjs.org" \
            | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Publish @windoc/core
        run: npm publish --access public --provenance
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-oidc.outputs.token }}

      - name: Publish @windoc/react
        run: npm publish --access public --provenance
        working-directory: react
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-oidc.outputs.token }}

      - name: Generate release notes
        id: cliff
        run: |
          npx git-cliff@latest --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
